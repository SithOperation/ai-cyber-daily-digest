name: AI & Cyber Daily Digest

on:
  # GitHub cron uses UTC and may start a scheduled run late. Keep one daily
  # trigger and do not gate the job on the runner's local clock.
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-cyber-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate digest
        run: python -u src/main.py

      - name: Validate published output
        run: python src/main.py --validate-only

      - name: Commit meaningful output changes
        shell: bash
        run: |
          git config user.name "ai-cyber-digest"
          git config user.email "ai-cyber-digest@users.noreply.github.com"
          git add data/ai_cyber_digest.json data/ai_cyber_digest_state.json output/latest_digest.md
          if git diff --cached --quiet; then
            echo "No meaningful digest changes"
            exit 0
          fi
          git commit -m "Update AI cyber digest"
          git push
