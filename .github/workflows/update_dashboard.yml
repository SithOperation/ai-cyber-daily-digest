name: Update Website Dashboard - Cyber Digest


on:

  workflow_run:

    workflows:
      - "AI Cyber Daily Digest"

    types:
      - completed


  workflow_dispatch:



permissions:

  contents: write



jobs:


  update-dashboard:


    if: ${{ github.event.workflow_run.conclusion == 'success' }}


    runs-on: ubuntu-latest



    steps:


      - name: Checkout AI Digest repository

        uses: actions/checkout@v4

        with:

          ref: main





      - name: Checkout Website repository

        uses: actions/checkout@v4

        with:

          repository: SithOperation/my-website

          path: website

          token: ${{ secrets.WEBSITE_TOKEN }}







      - name: Verify AI digest source

        run: |


          echo "Checking AI digest source..."


          test -f data/ai_cyber_digest.json || exit 1



          python3 <<EOF

          import json


          with open("data/ai_cyber_digest.json") as f:

              data = json.load(f)


          print("Generated:", data.get("generated"))

          print("Stories:", len(data.get("stories", [])))


          if not data.get("stories"):

              raise Exception("No stories found")


          EOF







      - name: Copy digest data

        run: |


          echo "Copying digest files..."


          mkdir -p website/data

          mkdir -p website/output



          cp data/ai_cyber_digest.json \

          website/data/ai_cyber_digest.json



          if [ -f output/latest_digest.md ]; then


              cp output/latest_digest.md \

              website/output/latest_digest.md


          fi



          echo "Digest copied successfully."







      - name: Verify website files

        run: |


          echo "Checking website files..."


          test -f website/data/ai_cyber_digest.json || exit 1



          python3 <<EOF

          import json


          with open("website/data/ai_cyber_digest.json") as f:

              data = json.load(f)


          print("Website digest generated:", data.get("generated"))

          print("Website stories:", len(data.get("stories", [])))

          EOF







      - name: Commit dashboard update

        working-directory: website

        run: |


          git config user.name "ai-cyber-monitor"

          git config user.email "actions@github.com"




          git add data/ai_cyber_digest.json



          if [ -f output/latest_digest.md ]; then

              git add output/latest_digest.md

          fi





          if git diff --cached --quiet; then


              echo "No dashboard changes detected."


              exit 0


          fi





          git commit \

          -m "Update AI cyber digest dashboard"



          git push
