name: AI Cyber Daily Digest


on:

  schedule:

    - cron: "0 9 * * *"


  workflow_dispatch:




permissions:

  contents: write




jobs:


  digest:


    runs-on: ubuntu-latest




    steps:


      - name: Checkout repository

        uses: actions/checkout@v4




      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"




      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt





      - name: Run AI Cyber Digest

        env:

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |

          python -u src/main.py





      - name: Verify generated files

        run: |

          echo "Checking generated files..."

          ls -la data

          ls -la output



          test -f data/ai_cyber_digest.json

          test -f data/ai_cyber_digest_state.json



          echo "Digest files verified."






      - name: Validate JSON

        run: |


          python3 <<EOF

          import json


          files = [

              "data/ai_cyber_digest.json",

              "data/ai_cyber_digest_state.json"

          ]


          for file in files:

              with open(file) as f:

                  json.load(f)

              print(file, "valid")

          EOF






      - name: Commit digest updates


        run: |


          git config user.name "ai-cyber-digest"

          git config user.email "ai-cyber-digest@users.noreply.github.com"



          git add data/

          git add output/



          if git diff --cached --quiet; then

              echo "No changes detected."

              exit 0

          fi



          git commit -m "Update AI cyber digest"



          git push
