name: AI Cyber Daily Digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ai-cyber-digest.py

      - name: Save state
        run: |
          git config user.name "ai-cyber-digest"
          git config user.email "ai-cyber-digest@users.noreply.github.com"

          if [ -f ai_cyber_digest_state.json ]; then
            git add ai_cyber_digest_state.json
            git commit -m "Update AI cyber digest state" || echo "No changes to commit"
            git push
          else
            echo "No state file found."
          fi
