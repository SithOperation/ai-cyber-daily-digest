name: AI Cyber Daily Digest

on:
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  digest:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -u src/main.py


      - name: Verify output
        run: |
          ls -la data
          ls -la output


      - name: Commit digest files
        run: |

          git config user.name "ai-cyber-digest"

          git config user.email "ai-cyber-digest@users.noreply.github.com"


          git add data/ai_cyber_digest_state.json

          git add output/latest_digest.md


          git commit \
          -m "Update AI cyber digest" \
          || echo "No changes"


          git push
